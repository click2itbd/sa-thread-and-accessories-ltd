---
deployment:
  tasks:
    - /bin/mkdir -p /home/sathread/sathread.com.bd

    # Next.js standalone application
    - /bin/cp -a .next/standalone/. /home/sathread/sathread.com.bd/

    # Public files
    - /bin/mkdir -p /home/sathread/sathread.com.bd/public
    - /bin/cp -a public/. /home/sathread/sathread.com.bd/public/

    # Next static files (renamed to next_static to bypass Apache hidden file rules)
    - /bin/mkdir -p /home/sathread/sathread.com.bd/next_static
    - /bin/cp -a .next/static/. /home/sathread/sathread.com.bd/next_static/

    # Copy .htaccess to route static files correctly
    - /bin/cp -a .htaccess /home/sathread/sathread.com.bd/.htaccess

    # Fix image cache directory permissions
    - /bin/mkdir -p /home/sathread/sathread.com.bd/.next/cache/images
    - /bin/chmod -R 755 /home/sathread/sathread.com.bd/.next/cache

    # Passenger restart
    - /bin/mkdir -p /home/sathread/sathread.com.bd/tmp
    - /bin/touch /home/sathread/sathread.com.bd/tmp/restart.txt