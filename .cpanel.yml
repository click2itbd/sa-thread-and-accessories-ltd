---
deployment:
  tasks:
    - export PATH=/opt/cpanel/ea-nodejs22/bin:$PATH
    - npm ci
    - npm run build

    - /bin/mkdir -p /home/sathread/sa-thread-app

    # Next.js standalone application
    - /bin/cp -a .next/standalone/. /home/sathread/sa-thread-app/

    # Public files
    - /bin/mkdir -p /home/sathread/sa-thread-app/public
    - /bin/cp -a public/. /home/sathread/sa-thread-app/public/

    # Next static files
    - /bin/mkdir -p /home/sathread/sa-thread-app/.next/static
    - /bin/cp -a .next/static/. /home/sathread/sa-thread-app/.next/static/

    # Passenger restart
    - /bin/mkdir -p /home/sathread/sa-thread-app/tmp
    - /bin/touch /home/sathread/sa-thread-app/tmp/restart.txt

    